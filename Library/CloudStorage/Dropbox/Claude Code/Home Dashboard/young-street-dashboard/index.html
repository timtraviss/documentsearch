<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11 Young Street · Mahurangi</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Electrolize&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root">
  <!-- Background layers -->
  <div id="map"></div>
  <div id="floorplan-stage">
    <div id="floorplan-canvas"></div>
  </div>
  <div class="vignette" id="vignette"></div>

  <!-- Clock — top left -->
  <div id="panel-clock" class="panel panel-tl"></div>

  <!-- Weather + Tides — right column -->
  <div class="panel-tr-col">
    <div id="panel-weather" class="panel panel-weather"></div>
    <div id="panel-tides"   class="panel panel-tides"></div>
  </div>

  <!-- Property — bottom left -->
  <div id="panel-property" class="panel panel-bl"></div>

  <!-- Control buttons (theme / floor-plan / admin) -->
  <div class="controls">
    <button id="btn-theme" class="ctrl-btn" aria-label="Toggle theme">
    </button>
    <button id="btn-floorplan" class="ctrl-btn hidden" aria-label="Toggle floor plan">
    </button>
    <button id="btn-admin" class="ctrl-btn" aria-label="Open admin panel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- Admin panel (slide-in from right) -->
  <div class="admin-scrim" id="admin-scrim"></div>
  <aside class="admin-panel" id="admin-panel">
    <header class="admin-head">
      <div>
        <div class="admin-eyebrow">System</div>
        <div class="admin-title">Admin · Display</div>
      </div>
      <button class="admin-close" id="admin-close" aria-label="Close admin">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </header>

    <div class="admin-body">
      <!-- Theme -->
      <div class="admin-section">
        <div class="admin-section-label">Theme</div>
        <div class="seg">
          <button class="seg-btn active" data-theme-btn="dark">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            Dark
          </button>
          <button class="seg-btn" data-theme-btn="light">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            Light
          </button>
        </div>
      </div>

      <!-- Accent -->
      <div class="admin-section">
        <div class="admin-section-label">Accent Colour</div>
        <div class="swatch-grid" id="accent-swatches"></div>
        <div class="admin-hex">
          <span>HEX</span>
          <input type="text" id="accent-hex-input" spellcheck="false" maxlength="7">
          <span class="hex-preview" id="accent-hex-preview"></span>
        </div>
      </div>

      <!-- Panel Opacity -->
      <div class="admin-section">
        <div class="admin-section-label">Panel Opacity</div>
        <div class="slider-row">
          <input type="range" id="slider-opacity" min="40" max="95" step="1" aria-label="Panel opacity">
          <div class="slider-val"><span id="val-opacity">72</span><span class="unit">%</span></div>
        </div>
        <div class="slider-hint"><span>Translucent</span><span>Solid</span></div>
      </div>

      <!-- Backdrop Blur -->
      <div class="admin-section">
        <div class="admin-section-label">Backdrop Blur</div>
        <div class="slider-row">
          <input type="range" id="slider-blur" min="0" max="40" step="1" aria-label="Backdrop blur">
          <div class="slider-val"><span id="val-blur">18</span><span class="unit">px</span></div>
        </div>
        <div class="slider-hint"><span>Crisp</span><span>Frosted</span></div>
      </div>

      <!-- Vignette -->
      <div class="admin-section">
        <div class="admin-section-label">Scene</div>
        <button class="tog-row on" id="tog-vignette">
          <div>
            <div class="tog-name">Vignette</div>
            <div class="tog-desc">Darken map edges</div>
          </div>
          <span class="tog-switch"><span class="tog-knob"></span></span>
        </button>
      </div>

      <!-- Reset -->
      <div class="admin-section">
        <button class="admin-reset" id="admin-reset">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
          Reset to defaults
        </button>
      </div>
    </div>

    <footer class="admin-foot">
      <span>v1.1.0</span>
      <span class="dot"></span>
      <span>Mahurangi Node</span>
      <span class="dot"></span>
      <span class="live">● Live</span>
    </footer>
  </aside>

  <!-- Floor plan page navigation -->
  <div class="fp-pager hidden" id="fp-pager">
    <button id="fp-prev" disabled aria-label="Previous">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="label"><span class="num" id="fp-num">1</span> / <span id="fp-total">1</span> · <span id="fp-name"></span></span>
    <button id="fp-next" aria-label="Next">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <!-- Floor plan zoom rail -->
  <div class="fp-zoom hidden" id="fp-zoom">
    <button id="fp-zoomin" aria-label="Zoom in">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button id="fp-zoomout" aria-label="Zoom out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button id="fp-reset" aria-label="Reset zoom">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
    </button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
